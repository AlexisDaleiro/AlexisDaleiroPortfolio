<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;background:#2A1A12;color:#F2EEE6;font-family:Courier New,monospace;overflow:hidden}
.wash{position:absolute;inset:0;background:radial-gradient(circle at 40% 40%,#C2551F 0,#5A2410 70%)}
.tray{position:absolute;left:80px;top:150px;width:820px;height:540px;background:#F2EEE6;border:18px solid #E9E4DA;padding:30px}
.print{width:100%;height:100%;background:linear-gradient(#9A9A94,#3A3632)}
h1{position:absolute;left:80px;top:48px;font:700 64px Courier New}
.line{position:absolute;right:60px;top:120px;width:420px}
.clip{height:150px;background:#9A9A94;margin-bottom:24px;border-top:8px solid #1a1a1a}
.st{position:absolute;left:80px;bottom:48px;display:flex;gap:32px;font:700 22px Courier New}
.btn{position:absolute;right:60px;bottom:40px;background:#F2EEE6;color:#2A1A12;padding:20px 40px;font:700 26px Courier New}
</style></head><body><div class="wash"></div><h1>ALEXIS DALEIRO · revelando</h1>
<div class="tray"><div class="print"></div></div>
<div class="line"><div class="clip"></div><div class="clip"></div><div class="clip"></div></div>
<div class="st"><span>COMPONER</span><span>EXPONER</span><span>REVELAR</span><span>FIJAR</span><span>SECAR</span></div>
<div class="btn">CONTACTO</div></body></html>
